<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wahlkreis-Finder — Ihre neue Adresse | WohnRoute</title>
<meta name="description" content="Ziehen Sie um? Geben Sie Ihre neue Adresse ein und finden Sie automatisch Ihren Wahlkreis für die Berliner Wahl 2026 — basierend auf den amtlichen Wahlkreisgrenzen.">
<link rel="canonical" href="https://wohnroute.de/wahlkreise/finder.html">
<style>
* { box-sizing: border-box; }
body { background:#04162E; color:#eaf2fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:0; line-height:1.6; }
header { background:#0a1f3a; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(230,126,34,0.15); }
header .logo { color:#E67E22; font-weight:800; font-size:1.05rem; }
.back-link { color:#7a9ab8; text-decoration:none; font-size:0.85rem; }
.container { max-width:640px; margin:0 auto; padding:24px 16px 60px; }
h1 { color:#E67E22; font-size:1.5rem; text-align:center; margin-bottom:6px; }
.sub { color:#7a9ab8; font-size:0.88rem; text-align:center; margin-bottom:24px; }
#addrInput { width:100%; padding:14px 16px; border-radius:12px; border:1px solid rgba(230,126,34,0.3); background:#0a1f3a; color:#eaf2fb; font-size:1rem; margin-bottom:10px; }
#findBtn { width:100%; background:#E67E22; color:#04162E; border:none; padding:14px; border-radius:60px; font-weight:700; font-size:1rem; cursor:pointer; }
#findBtn:disabled { opacity:0.6; }
#status { text-align:center; color:#7a9ab8; font-size:0.85rem; margin-top:14px; min-height:20px; }
#resultCard { display:none; background:#0a1f3a; border:1px solid rgba(230,126,34,0.3); border-radius:16px; padding:22px; margin-top:20px; text-align:center; }
#resultCard.show { display:block; }
#resultCard .big { color:#E67E22; font-size:1.3rem; font-weight:800; margin-bottom:6px; }
#resultCard .kurz { color:#b9c9dd; font-size:0.9rem; margin-bottom:14px; }
#resultCard a.go { display:inline-block; background:transparent; border:1px solid rgba(230,126,34,0.4); color:#E67E22; padding:9px 18px; border-radius:30px; text-decoration:none; font-size:0.85rem; }
.attribution { text-align:center; color:#5a7090; font-size:0.72rem; margin-top:30px; }
.attribution a { color:#7a9ab8; }
</style>
</head>
<body>
<header>
  <div class="logo">🏠 WohnRoute</div>
  <a href="/wahlkreise/" class="back-link">← Zurück</a>
</header>
<div class="container">
  <h1>Wahlkreis Ihrer neuen Adresse</h1>
  <div class="sub">Sie ziehen um? Adresse eingeben — wir finden automatisch Ihren künftigen Wahlkreis anhand der amtlichen Grenzen.</div>

  <input type="text" id="addrInput" placeholder="z. B. Alexanderplatz 1, Berlin" autocomplete="off">
  <button id="findBtn">📍 Wahlkreis finden</button>
  <div id="status"></div>

  <div id="resultCard">
    <div class="big" id="resBezirkWk"></div>
    <div class="kurz" id="resKurz"></div>
    <a class="go" id="resLink" href="#">Zum Bezirk →</a>
  </div>

  <div class="attribution">Adresssuche: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende (Nominatim) · Wahlkreisgrenzen: Amt für Statistik Berlin-Brandenburg (CC-BY)</div>
</div>

<script>
function slugBezirk(s) {
  return s.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function pointInRing(pt, ring) {
  var x = pt[0], y = pt[1], inside = false;
  for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    var xi = ring[i][0], yi = ring[i][1];
    var xj = ring[j][0], yj = ring[j][1];
    var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointInPolygon(pt, coordinates) {
  if (!pointInRing(pt, coordinates[0])) return false;
  for (var i = 1; i < coordinates.length; i++) {
    if (pointInRing(pt, coordinates[i])) return false;
  }
  return true;
}

var geoData = null;
function loadGeoData() {
  if (geoData) return Promise.resolve(geoData);
  return fetch('/wahlkreise/wahlkreise-geo-data.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { geoData = data; return data; });
}

function findWahlkreis(lon, lat) {
  var pt = [lon, lat];
  for (var i = 0; i < geoData.features.length; i++) {
    var f = geoData.features[i];
    if (pointInPolygon(pt, f.geometry.coordinates)) {
      return f.properties;
    }
  }
  return null;
}

var btn = document.getElementById('findBtn');
var input = document.getElementById('addrInput');
var statusEl = document.getElementById('status');
var resultCard = document.getElementById('resultCard');

function doSearch() {
  var addr = input.value.trim();
  if (!addr) { statusEl.textContent = 'Bitte eine Adresse eingeben.'; return; }
  btn.disabled = true;
  resultCard.classList.remove('show');
  statusEl.textContent = '⏳ Adresse wird gesucht...';

  var query = encodeURIComponent(addr + ', Berlin, Germany');
  var viewbox = '13.088,52.675,13.761,52.338';
  fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + query + '&viewbox=' + viewbox + '&bounded=1&limit=1')
    .then(function(r) { return r.json(); })
    .then(function(results) {
      if (!results.length) {
        statusEl.textContent = '⚠️ Adresse nicht gefunden. Bitte genauer angeben (Straße, Hausnummer).';
        btn.disabled = false;
        return;
      }
      var lat = parseFloat(results[0].lat);
      var lon = parseFloat(results[0].lon);
      statusEl.textContent = '⏳ Wahlkreis wird ermittelt...';
      return loadGeoData().then(function() {
        var match = findWahlkreis(lon, lat);
        btn.disabled = false;
        if (!match) {
          statusEl.textContent = '⚠️ Kein Wahlkreis gefunden — Adresse liegt evtl. außerhalb Berlins.';
          return;
        }
        statusEl.textContent = '';
        document.getElementById('resBezirkWk').textContent = match.bezirk + ' — Wahlkreis ' + match.wk;
        document.getElementById('resLink').href = '/wahlkreise/' + slugBezirk(match.bezirk) + '.html#wk' + match.wk;
        resultCard.classList.add('show');
      });
    })
    .catch(function() {
      statusEl.textContent = '⚠️ Fehler bei der Suche. Bitte später erneut versuchen.';
      btn.disabled = false;
    });
}

btn.addEventListener('click', doSearch);
input.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
